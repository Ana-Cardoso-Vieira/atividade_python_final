{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Criar conta</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required minlength="4">
          </div>
          <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle"></i> Cadastrar</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
