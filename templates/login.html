{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-check2-square"></i> Painel de Tarefas</h3>
        <h5 class="text-center text-muted mb-4">Entrar</h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Não tem conta? <a href="{{ url_for('registro') }}">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
