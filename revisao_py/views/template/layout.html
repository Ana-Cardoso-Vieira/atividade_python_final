<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RaspaVoo — raspando voos do céu{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="ceu" aria-hidden="true">
        <span class="nuvem n1"></span>
        <span class="nuvem n2"></span>
        <span class="nuvem n3"></span>
        <svg class="aviao-flutuante" viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 28 L52 22 L112 18 L100 24 L112 30 L52 28 L28 40 L22 36 L36 28 Z"
                  fill="currentColor" opacity="0.92"/>
            <path d="M52 22 L68 8 L74 10 L62 24" fill="currentColor" opacity="0.75"/>
            <circle cx="20" cy="28" r="2.2" fill="#f7c948"/>
        </svg>
    </div>

    <nav class="nav">
        <a class="nav-brand" href="{{ url_for('site.home') }}">
            <svg class="nav-aviao" viewBox="0 0 48 20" aria-hidden="true">
                <path d="M2 12 L22 9 L46 7 L40 11 L46 14 L22 13 L10 18 L7 16 L14 12 Z" fill="currentColor"/>
            </svg>
            Raspa<span>Voo</span>
        </a>
        <a href="{{ url_for('site.home') }}">Buscar voos</a>
        <a href="{{ url_for('site.historico') }}">Histórico</a>
        <a href="/api" target="_blank">API JSON</a>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for categoria, mensagem in messages %}
                    <div class="flash flash-{{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
