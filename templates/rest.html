{% extends "base.html" %}
{% block titulo %}API REST{% endblock %}
{% block conteudo %}
<h4 class="mb-4"><i class="bi bi-cloud-arrow-up"></i> Desafio Avançado — API REST (fetch)</h4>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h6>Nova tarefa via API</h6>
    <form id="formRest" class="row g-2">
      <div class="col-md-4">
        <input type="text" class="form-control" id="restTitulo" placeholder="Título" required>
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="restDescricao" placeholder="Descrição">
      </div>
      <div class="col-md-2">
        <select class="form-select" id="restStatus">
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluida">Concluída</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-send"></i> Enviar</button>
      </div>
    </form>
  </div>
</div>

<div id="restLista" class="row g-3"></div>

{% endblock %}

{% block scripts %}
<script>
function corPorStatus(status) {
  if (status === "pendente") return "card-pendente";
  if (status === "em_andamento") return "card-andamento";
  return "card-concluida";
}

function renderTarefas(tarefas) {
  const container = document.getElementById("restLista");
  if (tarefas.length === 0) {
    container.innerHTML = `<div class="col-12"><div class="alert alert-secondary">Nenhuma tarefa.</div></div>`;
    return;
  }
  container.innerHTML = tarefas
    .map(
      (t) => `
    <div class="col-md-4">
      <div class="card task-card ${corPorStatus(t.status)} h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">${t.titulo}</h5>
          <p class="card-text">${t.descricao || "<span class='text-muted'>Sem descrição</span>"}</p>
          <span class="badge bg-dark">${t.status}</span>
        </div>
        <div class="card-footer bg-transparent d-flex justify-content-end">
          <button class="btn btn-sm btn-outline-danger" onclick="excluirRest(${t.id})">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>`
    )
    .join("");
}

function carregarTarefas() {
  fetch("/api/tarefas")
    .then((res) => res.json())
    .then(renderTarefas);
}

function excluirRest(id) {
  fetch(`/api/tarefas/${id}`, { method: "DELETE" }).then(carregarTarefas);
}

document.getElementById("formRest").addEventListener("submit", function (e) {
  e.preventDefault();
  const titulo = document.getElementById("restTitulo").value;
  const descricao = document.getElementById("restDescricao").value;
  const status = document.getElementById("restStatus").value;

  fetch("/api/tarefas", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ titulo, descricao, status }),
  }).then(() => {
    document.getElementById("formRest").reset();
    carregarTarefas();
  });
});

carregarTarefas();
</script>
{% endblock %}
